    <h2>Inquiry and pre order request form</h2>
    <fieldset>
<form action="/submit-request" method="post">


  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>
  <br>


  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>
<br>

  <label for="pickup-date">Pickup Date</label>
  <input type="date" id="pickup-date" name="pickup_date" required>
<br>

  <label for="request-type">Request Type</label>
  <select id="request-type" name="request_type" required>
    <option value="">Select an option</option>
    <option value="pre-order">Pre‑order</option>
    <option value="general-question">General Question</option>
  </select>
<br>

  <label for="item-details">Item Details</label>
  <textarea id="item-details" name="item_details" rows="4" required></textarea>
<br>

  <label for="allergy-notes">Allergy Notes (if applicable)</label>
  <textarea id="allergy-notes" name="allergy_notes" rows="3"></textarea>
  <button type="submit">Submit Request</button>
</fieldset>
</form>
